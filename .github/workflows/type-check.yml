name: ✅ TypeScript Check

on:
  push:
    branches: ['**']
  pull_request:
    branches:
      - main
      - master

jobs:
  typecheck:
    name: 🔍 Vérification TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔍 TypeScript check
        run: npx tsc --noEmit

      - name: ✅ Succès
        run: echo "TypeScript OK ✅"
