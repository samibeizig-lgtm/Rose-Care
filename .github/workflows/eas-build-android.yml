name: Build Android APK (Rose Care)

on:
  push:
    branches:
      - claude/pregnancy-companion-app-k8dnnh
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or development)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build-android:
    name: Build Android APK via EAS Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is set ✓"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS Cloud
        id: eas_build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          [ -z "$PROFILE" ] && PROFILE="preview"
          echo "Building with profile: $PROFILE"

          # EAS CLI streams progress to stderr; --json writes final JSON to stdout.
          # We capture stdout into BUILD_JSON and let stderr flow to the log so any
          # error messages are visible. We do NOT suppress errors with || true.
          BUILD_JSON=$(eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json)

          echo "Raw EAS output:"
          echo "$BUILD_JSON"

          # EAS may return an array (multiple builds) or a single object
          APK_URL=$(echo "$BUILD_JSON" | jq -r '
            if type == "array" then .[0] else . end
            | .artifacts.buildUrl // .artifacts.url // ""
          ')

          echo "APK URL: $APK_URL"

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::EAS build succeeded but returned no download URL. Check the EAS dashboard."
            exit 1
          fi

          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          URL="${{ steps.eas_build.outputs.apk_url }}"
          PROFILE="${{ steps.eas_build.outputs.profile }}"
          echo "Downloading APK from: $URL"
          curl -fL "$URL" -o "rose-care-${PROFILE}.apk"
          ls -lh *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rose-care-${{ steps.eas_build.outputs.profile }}-${{ github.run_number }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          PROFILE="${{ steps.eas_build.outputs.profile }}"
          echo "### ✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** $PROFILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **EAS URL:** ${{ steps.eas_build.outputs.apk_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
