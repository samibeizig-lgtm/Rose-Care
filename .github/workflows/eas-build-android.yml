name: Build Android APK (Rose Care)

on:
  push:
    branches:
      - claude/pregnancy-companion-app-k8dnnh
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or development)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build-android:
    name: Build Android APK (local — no EAS quota)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | grep -v "^Warning:" || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is set ✓"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK locally (no EAS Cloud quota used)
        id: eas_build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          [ -z "$PROFILE" ] && PROFILE="preview"
          echo "Building locally with profile: $PROFILE"

          # --local builds on this runner instead of EAS Cloud servers.
          # EXPO_TOKEN is still used to pull keystore credentials.
          eas build \
            --local \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive

          # Find the generated APK (eas build --local puts it in the project root)
          APK=$(find . -maxdepth 2 -name "*.apk" ! -path "*/node_modules/*" ! -path "*/.gradle/*" | head -1)

          if [ -z "$APK" ]; then
            echo "::error::No APK found after local build. Check Gradle output above."
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" "rose-care-${PROFILE}.apk"
          ls -lh rose-care-*.apk

          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rose-care-${{ steps.eas_build.outputs.profile }}-${{ github.run_number }}
          path: "rose-care-*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          PROFILE="${{ steps.eas_build.outputs.profile }}"
          echo "### ✅ APK built successfully (local build)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** $PROFILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Built on:** GitHub Actions runner (no EAS Cloud quota consumed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
