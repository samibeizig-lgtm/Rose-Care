name: 🤖 Build Android APK (Rose Care)

on:
  push:
    branches:
      - claude/pregnancy-companion-app-k8dnnh
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build-android:
    name: 📱 Build Android APK (EAS Cloud)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🏗️ Build APK via EAS Cloud (attend la fin)
        id: eas_build
        run: |
          BUILD_JSON=$(eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --wait \
            --json 2>/dev/null || true)

          APK_URL=$(echo "$BUILD_JSON" | python3 -c "
import sys, json
raw = sys.stdin.read().strip()
try:
    data = json.loads(raw)
    builds = data if isinstance(data, list) else [data]
    for b in builds:
        url = b.get('artifacts', {}).get('buildUrl', '')
        if url:
            print(url)
            break
except Exception as e:
    import sys; print('parse error:', e, file=sys.stderr)
" 2>/dev/null || echo "")

          echo "APK URL: $APK_URL"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Télécharger l'APK depuis EAS
        run: |
          URL="${{ steps.eas_build.outputs.apk_url }}"
          if [ -z "$URL" ]; then
            echo "::error::APK URL is empty — check EAS build logs"
            exit 1
          fi
          curl -L "$URL" -o rose-care-${{ github.event.inputs.profile }}.apk
          ls -lh *.apk

      - name: 📤 Upload APK — téléchargeable dans Actions
        uses: actions/upload-artifact@v4
        with:
          name: rose-care-${{ github.event.inputs.profile }}-${{ github.run_number }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: ✅ Résumé
        run: |
          echo "### 📱 APK généré !" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Profil :** ${{ github.event.inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit :** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL EAS :** ${{ steps.eas_build.outputs.apk_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ Téléchargez l'APK dans l'onglet **Artifacts** ci-dessus." >> $GITHUB_STEP_SUMMARY
