name: 🤖 Build Android APK (Rose Care)

on:
  push:
    branches:
      - main
      - master
      - claude/pregnancy-companion-app-k8dnnh
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build Android APK
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload artifact si APK local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rose-care-build-info
          path: |
            *.apk
            *.aab
          if-no-files-found: ignore
          retention-days: 30

      - name: 💬 Comment build URL sur PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build Android lancé sur EAS !** Suivez la progression sur https://expo.dev'
            })
