name: Build Android APK (Rose Care)

on:
  push:
    branches:
      - claude/pregnancy-companion-app-k8dnnh
    paths:
      - 'build-trigger.txt'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or development)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - development

jobs:
  build-android:
    name: Build Android APK via EAS Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK via EAS Cloud
        id: eas_build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          if [ -z "$PROFILE" ]; then
            PROFILE="preview"
          fi
          echo "Building with profile: $PROFILE"

          BUILD_JSON=$(eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --wait \
            --json 2>/dev/null || true)

          echo "Build output: $BUILD_JSON"

          APK_URL=$(echo "$BUILD_JSON" | jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // ""' 2>/dev/null || echo "")

          echo "APK URL: $APK_URL"
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        run: |
          URL="${{ steps.eas_build.outputs.apk_url }}"
          PROFILE="${{ steps.eas_build.outputs.profile }}"
          if [ -z "$URL" ]; then
            echo "::error::APK URL is empty — check EAS build logs above"
            exit 1
          fi
          curl -L "$URL" -o "rose-care-${PROFILE}.apk"
          ls -lh *.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rose-care-${{ steps.eas_build.outputs.profile }}-${{ github.run_number }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          PROFILE="${{ steps.eas_build.outputs.profile }}"
          echo "### APK built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** $PROFILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **EAS URL:** ${{ steps.eas_build.outputs.apk_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
