name: 📡 Expo Preview (QR Code)

on:
  push:
    branches:
      - main
      - master
      - claude/pregnancy-companion-app-k8dnnh
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish-preview:
    name: 📡 Publier sur Expo Go
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔧 Setup EAS CLI
        run: npm install -g eas-cli

      - name: 📡 Publier mise à jour OTA
        run: |
          eas update \
            --branch preview \
            --message "Preview: ${{ github.sha }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 💬 Post QR Code sur PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📱 Preview Rose Care disponible !\n\n> Scannez avec **Expo Go** sur votre téléphone\n\n✅ Commit: \`${context.sha.substring(0, 7)}\`\n\n📡 Suivez le lien dans les logs du workflow.`
            })
