name: 📡 Expo Preview (QR Code)

on:
  push:
    branches:
      - main
      - master
      - claude/pregnancy-companion-app-k8dnnh
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish-preview:
    name: 📡 Publier sur Expo Go
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔧 Setup Expo CLI & EAS
        run: |
          npm install -g expo-cli
          npm install -g eas-cli

      - name: 🔐 Login to Expo
        run: expo login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📡 Publish to Expo Go (OTA Update)
        run: |
          eas update \
            --branch preview \
            --message "Preview: ${{ github.sha }}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 💬 Post QR Code to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const slug = 'rose-care';
            const qrUrl = `https://qr.expo.dev/eas-update?slug=rose-care&projectId=rose-care&groupId=preview`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: `## 📱 Preview Rose Care disponible !\n\n> Scannez ce QR code avec **Expo Go** sur votre téléphone\n\n![QR Code](${qrUrl})\n\n**Ou ouvrez :** \`exp://u.expo.dev/rose-care?channel-name=preview\`\n\n✅ Commit: \`${context.sha.substring(0, 7)}\``
            });
